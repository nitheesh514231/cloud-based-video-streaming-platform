<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CloudStream Video Platform</title>

  <style>
    :root {
      --bg: #f2f5f9;
      --card: #ffffff;
      --text: #202124;
      --muted: #667085;
      --primary: #1769aa;
      --primary-hover: #0d4f83;
      --border: #d7dee8;
      --danger: #c0392b;
    }

    body.dark {
      --bg: #121212;
      --card: #202020;
      --text: #eeeeee;
      --muted: #bbbbbb;
      --primary: #4da3ff;
      --primary-hover: #1976d2;
      --border: #3c3c3c;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      transition: 0.3s;
    }

    header {
      background: var(--primary);
      color: white;
      padding: 22px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    header h1 {
      margin: 0;
    }

    header p {
      margin: 7px 0 0;
    }

    .header-buttons {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    main {
      width: 90%;
      max-width: 1150px;
      margin: 30px auto;
    }

    .card,
    .login-box,
    .video-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
    }

    .card {
      padding: 25px;
      margin-bottom: 25px;
    }

    .card h2 {
      margin-top: 0;
      color: var(--primary);
    }

    input,
    textarea {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 15px;
    }

    textarea {
      height: 90px;
      resize: vertical;
    }

    button {
      border: none;
      background: var(--primary);
      color: white;
      padding: 11px 17px;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 8px;
      font-size: 14px;
    }

    button:hover {
      background: var(--primary-hover);
    }

    .logout-button,
    .delete-button {
      background: var(--danger);
    }

    .logout-button:hover,
    .delete-button:hover {
      background: #922b21;
    }

    .gray-button {
      background: #555555;
    }

    .hidden {
      display: none !important;
    }

    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      padding: 30px;
    }

    .login-box h1 {
      text-align: center;
      color: var(--primary);
    }

    .demo-box {
      margin-top: 18px;
      padding: 12px;
      background: var(--bg);
      border-radius: 6px;
      color: var(--muted);
      font-size: 13px;
    }

    .profile-info {
      line-height: 1.8;
      color: var(--muted);
    }

    .toolbar {
      display: flex;
      gap: 15px;
      align-items: center;
      flex-wrap: wrap;
    }

    .toolbar input {
      flex: 1;
      min-width: 230px;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
      gap: 22px;
      margin-top: 20px;
    }

    .video-card {
      overflow: hidden;
    }

    .video-card video {
      display: block;
      width: 100%;
      height: 190px;
      background: #000;
    }

    .video-details {
      padding: 18px;
    }

    .video-details h3 {
      margin-top: 0;
      color: var(--primary);
    }

    .video-details p {
      color: var(--muted);
      line-height: 1.5;
    }

    #message {
      position: fixed;
      right: 20px;
      bottom: 20px;
      display: none;
      background: #222;
      color: white;
      padding: 14px 20px;
      border-radius: 6px;
      z-index: 20;
    }

    progress {
      width: 100%;
      height: 20px;
      display: none;
      margin-top: 15px;
    }

    @media (max-width: 600px) {
      header {
        padding: 20px;
      }

      main {
        width: 94%;
      }
    }
  </style>
</head>

<body>

  <!-- Login Page -->
  <section id="loginPage" class="login-page">
    <div class="login-box">
      <h1>CloudStream</h1>
      <p>Login to access the video platform.</p>

      <form id="loginForm">
        <input
          type="email"
          id="loginEmail"
          placeholder="Email address"
          required
        >

        <input
          type="password"
          id="loginPassword"
          placeholder="Password"
          minlength="6"
          required
        >

        <button type="submit">Login</button>
      </form>

      <div class="demo-box">
        <strong>Demo account</strong><br>
        Email: admin@example.com<br>
        Password: password123
      </div>
    </div>
  </section>

  <!-- Main Application -->
  <section id="appPage" class="hidden">

    <header>
      <div>
        <h1>CloudStream</h1>
        <p>Cloud-Based Video Streaming Platform</p>
      </div>

      <div class="header-buttons">
        <span id="welcomeText"></span>

        <button id="themeButton">
          Dark Theme
        </button>

        <button id="logoutButton" class="logout-button">
          Logout
        </button>
      </div>
    </header>

    <main>

      <!-- Profile and Password Section -->
      <section class="card">
        <h2>My Profile</h2>

        <div class="profile-info">
          <div>
            <strong>Name:</strong>
            <span id="profileName"></span>
          </div>

          <div>
            <strong>Email:</strong>
            <span id="profileEmail"></span>
          </div>
        </div>

        <button id="passwordToggle">
          Change Password
        </button>

        <form id="passwordForm" class="hidden">
          <input
            type="password"
            id="currentPassword"
            placeholder="Current password"
            required
          >

          <input
            type="password"
            id="newPassword"
            placeholder="New password"
            minlength="6"
            required
          >

          <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm new password"
            minlength="6"
            required
          >

          <button type="submit">
            Update Password
          </button>
        </form>
      </section>

      <!-- Upload Section -->
      <section class="card">
        <h2>Upload Video</h2>

        <form id="uploadForm">
          <input
            type="text"
            id="videoTitle"
            placeholder="Video title"
            required
          >

          <textarea
            id="videoDescription"
            placeholder="Video description"
            required
          ></textarea>

          <input
            type="file"
            id="videoFile"
            accept="video/*"
            required
          >

          <button type="submit">
            Upload Video
          </button>

          <progress id="uploadProgress" value="0" max="100"></progress>
        </form>
      </section>

      <!-- Video Section -->
      <section>
        <div class="toolbar">
          <h2>Available Videos</h2>

          <input
            type="search"
            id="searchBox"
            placeholder="Search videos..."
          >
        </div>

        <div id="videoGrid" class="video-grid"></div>
      </section>

    </main>
  </section>

  <div id="message"></div>

  <script>
    const loginPage = document.getElementById("loginPage");
    const appPage = document.getElementById("appPage");

    const loginForm = document.getElementById("loginForm");
    const logoutButton = document.getElementById("logoutButton");

    const themeButton = document.getElementById("themeButton");
    const welcomeText = document.getElementById("welcomeText");

    const profileName = document.getElementById("profileName");
    const profileEmail = document.getElementById("profileEmail");

    const passwordToggle = document.getElementById("passwordToggle");
    const passwordForm = document.getElementById("passwordForm");

    const uploadForm = document.getElementById("uploadForm");
    const uploadProgress = document.getElementById("uploadProgress");

    const searchBox = document.getElementById("searchBox");
    const videoGrid = document.getElementById("videoGrid");
    const messageBox = document.getElementById("message");

    let currentUser = null;
    let videos = [];

    const defaultUser = {
      name: "Administrator",
      email: "admin@example.com",
      password: "password123"
    };

    let savedUser = JSON.parse(localStorage.getItem("cloudUser"));

    if (!savedUser) {
      savedUser = defaultUser;
      localStorage.setItem("cloudUser", JSON.stringify(savedUser));
    }

    function showMessage(text) {
      messageBox.textContent = text;
      messageBox.style.display = "block";

      setTimeout(function() {
        messageBox.style.display = "none";
      }, 3000);
    }

    function loadTheme() {
      const darkMode =
        localStorage.getItem("cloudDarkMode") === "true";

      document.body.classList.toggle("dark", darkMode);

      themeButton.textContent =
        darkMode ? "Light Theme" : "Dark Theme";
    }

    themeButton.addEventListener("click", function() {
      document.body.classList.toggle("dark");

      const darkMode =
        document.body.classList.contains("dark");

      localStorage.setItem("cloudDarkMode", darkMode);

      themeButton.textContent =
        darkMode ? "Light Theme" : "Dark Theme";
    });

    loginForm.addEventListener("submit", function(event) {
      event.preventDefault();

      const email = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPassword").value;

      if (
        email === savedUser.email &&
        password === savedUser.password
      ) {
        currentUser = savedUser;

        sessionStorage.setItem(
          "cloudCurrentUser",
          JSON.stringify(currentUser)
        );

        loginPage.classList.add("hidden");
        appPage.classList.remove("hidden");

        updateProfile();
        loadTheme();
        loadVideos();

        loginForm.reset();
        showMessage("Login successful.");
      } else {
        showMessage("Invalid email or password.");
      }
    });

    logoutButton.addEventListener("click", function() {
      sessionStorage.removeItem("cloudCurrentUser");

      currentUser = null;
      appPage.classList.add("hidden");
      loginPage.classList.remove("hidden");

      showMessage("You have been logged out.");
    });

    function updateProfile() {
      welcomeText.textContent = `Welcome, ${currentUser.name}`;
      profileName.textContent = currentUser.name;
      profileEmail.textContent = currentUser.email;
    }

    passwordToggle.addEventListener("click", function() {
      passwordForm.classList.toggle("hidden");

      passwordToggle.textContent =
        passwordForm.classList.contains("hidden")
          ? "Change Password"
          : "Cancel Password Change";
    });

    passwordForm.addEventListener("submit", function(event) {
      event.preventDefault();

      const currentPassword =
        document.getElementById("currentPassword").value;

      const newPassword =
        document.getElementById("newPassword").value;

      const confirmPassword =
        document.getElementById("confirmPassword").value;

      if (currentPassword !== currentUser.password) {
        showMessage("Current password is incorrect.");
        return;
      }

      if (newPassword.length < 6) {
        showMessage("New password must contain at least 6 characters.");
        return;
      }

      if (newPassword !== confirmPassword) {
        showMessage("New passwords do not match.");
        return;
      }

      savedUser.password = newPassword;
      currentUser.password = newPassword;

      localStorage.setItem(
        "cloudUser",
        JSON.stringify(savedUser)
      );

      sessionStorage.setItem(
        "cloudCurrentUser",
        JSON.stringify(currentUser)
      );

      passwordForm.reset();
      passwordForm.classList.add("hidden");
      passwordToggle.textContent = "Change Password";

      showMessage("Password changed successfully.");
    });

    function loadVideos() {
      const storedVideos =
        JSON.parse(localStorage.getItem("cloudVideos")) || [];

      videos = storedVideos;
      displayVideos(videos);
    }

    function displayVideos(videoData) {
      videoGrid.innerHTML = "";

      if (videoData.length === 0) {
        videoGrid.innerHTML = "<p>No videos available.</p>";
        return;
      }

      videoData.forEach(function(video) {
        const card = document.createElement("div");
        card.className = "video-card";

        card.innerHTML = `
          <video controls>
            <source src="${video.url}" type="${video.type}">
            Your browser does not support video playback.
          </video>

          <div class="video-details">
            <h3>${escapeHTML(video.title)}</h3>
            <p>${escapeHTML(video.description)}</p>
            <p>
              <strong>Uploaded:</strong>
              ${escapeHTML(video.date)}
            </p>

            <a href="${video.url}" download="${video.fileName}">
              <button>Download</button>
            </a>

            <button
              class="delete-button"
              onclick="deleteVideo(${video.id})">
              Delete
            </button>
          </div>
        `;

        videoGrid.appendChild(card);
      });
    }

    uploadForm.addEventListener("submit", function(event) {
      event.preventDefault();

      const fileInput = document.getElementById("videoFile");
      const file = fileInput.files[0];

      if (!file) {
        showMessage("Please select a video file.");
        return;
      }

      if (!file.type.startsWith("video/")) {
        showMessage("Please select a valid video file.");
        return;
      }

      const title = document.getElementById("videoTitle").value.trim();
      const description =
        document.getElementById("videoDescription").value.trim();

      const videoUrl = URL.createObjectURL(file);

      const newVideo = {
        id: Date.now(),
        title: title,
        description: description,
        fileName: file.name,
        type: file.type,
        url: videoUrl,
        date: new Date().toLocaleDateString()
      };

      videos.push(newVideo);

      /*
        Object URLs work during the current page session.
        A real cloud application should upload the file
        to a backend or cloud storage service.
      */

      uploadProgress.style.display = "block";
      uploadProgress.value = 0;

      let progress = 0;

      const progressTimer = setInterval(function() {
        progress += 20;
        uploadProgress.value = progress;

        if (progress >= 100) {
          clearInterval(progressTimer);

          uploadProgress.style.display = "none";
          uploadForm.reset();
          displayVideos(videos);

          showMessage("Video uploaded successfully.");
        }
      }, 100);
    });

    searchBox.addEventListener("input", function() {
      const searchText = searchBox.value.toLowerCase();

      const filteredVideos = videos.filter(function(video) {
        return (
          video.title.toLowerCase().includes(searchText) ||
          video.description.toLowerCase().includes(searchText)
        );
      });

      displayVideos(filteredVideos);
    });

    function deleteVideo(id) {
      const confirmation = confirm(
        "Are you sure you want to delete this video?"
      );

      if (!confirmation) {
        return;
      }

      const video = videos.find(item => item.id === id);

      if (video) {
        URL.revokeObjectURL(video.url);
      }

      videos = videos.filter(item => item.id !== id);
      displayVideos(videos);

      showMessage("Video deleted successfully.");
    }

    function escapeHTML(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    const existingSession =
      sessionStorage.getItem("cloudCurrentUser");

    if (existingSession) {
      currentUser = JSON.parse(existingSession);

      loginPage.classList.add("hidden");
      appPage.classList.remove("hidden");

      updateProfile();
      loadTheme();
      loadVideos();
    }
  </script>

</body>
</html>
